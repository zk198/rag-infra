include:
  - ../rag-ingestion/compose.yaml
  - ../rag-indexer/compose.yaml
  - ../rag-retrieval/compose.yaml
  - ../rag-gateway/compose.yaml

services:
  pst-agent:
    ports: []
  rag-retrieval:
    ports: []
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
